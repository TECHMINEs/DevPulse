name: DevPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # Frontend: Lint + Build
  # ============================================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://devpulse-api.onrender.com
          VITE_SOCKET_URL: https://devpulse-api.onrender.com

  # ============================================================================
  # Backend: Lint + Basic checks
  # ============================================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint --if-present

      # TODO: add actual tests once we have better test coverage
      # - name: Test
      #   run: npm test

  # ============================================================================
  # ML Service: Lint + type check
  # ============================================================================
  ml-service:
    name: ML Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train models (verify training works)
        run: python train.py

      - name: Check API can start
        run: |
          timeout 10 python -c "from main import app; print('✅ FastAPI app loads successfully')" || true
